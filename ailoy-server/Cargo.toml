[package]
name = "ailoy-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "An Ailoy server over TCP, keeping its agents and their sessions in files."
publish = false

[dependencies]
ailoy-core = { path = "../ailoy-core", version = "0.3.2" }
ailoy-runner = { path = "../ailoy-runner", version = "0.3.2" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
virtx = { workspace = true }

[dev-dependencies]
tempfile = "3"
