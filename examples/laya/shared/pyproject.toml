[project]
name = "laya-ncnn"
version = "0.1.0"
description = "Downloads the Laya checkpoint and converts it to ncnn for the laya example, on the host."
# The locked torch has no wheels for Python 3.15, so uv must not pick or download one.
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface_hub",
    "laya==0.3.20",
    "ncnn",
    "numpy",
    "pnnx",
    "torch",
    "transformers",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false
