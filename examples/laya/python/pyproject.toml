[project]
name = "ailoy-example-laya"
version = "0.1.0"
description = "Laya on ncnn as an agent's skill, on ailoy's Python bindings, and the script that downloads and converts its checkpoint."
requires-python = ">=3.10"
dependencies = [
    "ailoy-py",
    "virtx",
    "huggingface_hub",
    "laya==0.3.20",
    "ncnn",
    "numpy",
    "pnnx",
    "python-dotenv>=1",
    "torch",
    "transformers",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false

[tool.uv.sources]
# The bindings in this checkout, built by maturin on the first `uv run`.
ailoy-py = { path = "../../../bindings/python", editable = true }
# TEMPORARY: virtx's checkout beside this one, as the bindings take it, until a virtx
# release carries `_relay`.
virtx = { path = "../../../../virtx/bindings/python", editable = true }
