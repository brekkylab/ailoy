[project]
name = "laya-ncnn"
version = "0.1.0"
description = "Downloads the Laya checkpoint and converts it to ncnn for examples/laya, on the host."
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub",
    "laya==0.3.20",
    "ncnn",
    "numpy",
    "pnnx",
    "torch",
    "transformers",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false
