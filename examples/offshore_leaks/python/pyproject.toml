[project]
name = "ailoy-example-offshore-leaks"
version = "0.1.0"
description = "ICIJ's Offshore Leaks database analyzed by an agent, on ailoy's Python bindings, and the script that loads it into DuckDB."
requires-python = ">=3.10"
dependencies = [
    "ailoy-py",
    # Pinned: the guest opens the file this writes and must install the same version.
    "duckdb==1.5.5",
    "python-dotenv>=1",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false

[tool.uv.sources]
# The bindings in this checkout, built by maturin on the first `uv run`.
ailoy-py = { path = "../../../bindings/python", editable = true }
