[project]
name = "sam3-ncnn"
version = "0.1.0"
description = "Downloads the SAM3 checkpoint and converts it to ncnn for the sam3 example, on the host."
# The locked torch has no wheels for Python 3.15, so uv must not pick or download one.
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface_hub",
    "ncnn",
    "numpy",
    "pillow",
    "pnnx",
    "torch",
    "torchvision",
    "transformers",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false
