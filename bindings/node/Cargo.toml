[package]
name = "ailoy-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
ailoy = { path = "../.." }
# For `Failure`, a console's refusal inside an agent's error. Must be the same crate `ailoy`
# depends on, so the type matches the one ailoy's errors carry.
cortex = { path = "../../../cortex", default-features = false }
# cortex's JavaScript classes, linked into this addon (napi registers them on link) rather than
# loaded from cortex's own: a `ConsoleClient` built by another addon is an opaque copy of cortex
# this addon cannot unwrap to hand to an agent. cortex-node builds an `rlib` for this.
cortex-node = { path = "../../../cortex/bindings/node", default-features = false }
# `serde-json` for `Env::to_js_value`/`from_js_value`: messages, specs and tool arguments cross
# as their serde objects, not per-type mirrors — ailoy's JSON shape *is* its interface. The
# other features match cortex-node's so the two agree.
napi = { version = "3", default-features = false, features = ["napi8", "async", "tokio_rt", "serde-json"] }
napi-derive = "3"
anyhow = "1"
async-stream = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "rt"] }
url = "2.5"

[features]
# `mount` on by default: `HostMount` gives an agent a directory held in memory, and needs the
# host's FUSE provider (setup in cortex's README).
default = ["mount"]
mount = ["cortex-node/mount"]
