[project]
name = "ailoy-example-tts"
version = "0.1.0"
description = "Qwen3-TTS on ncnn as an agent's skill, on ailoy's Python bindings, and the script that downloads and converts its checkpoint."
requires-python = ">=3.10"
dependencies = [
    "ailoy-py",
    "huggingface_hub",
    "ncnn",
    "numpy",
    "pnnx",
    "python-dotenv>=1",
    "qwen-tts",
    "soundfile",
    "torch",
]

[tool.uv]
# Scripts, not a package: `uv run` only needs the environment.
package = false

[tool.uv.sources]
# The bindings in this checkout, built by maturin on the first `uv run`.
ailoy-py = { path = "../..", editable = true }
