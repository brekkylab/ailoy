[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "ailoy-py"
dynamic = ["version"]
description = "Agents that drive a language model through tool-augmented turns, in a virtx console."
readme = "../../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    # The console an agent runs in. Any virtx speaking console protocol 1 whose
    # `ConsoleClient` has `_relay` (see `src/console.rs`).
    "virtx>=0.1.1,<0.2",
    # `NotRequired`, for `ailoy.types`, is in `typing` from 3.11.
    "typing_extensions>=4; python_version < '3.11'",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/brekkylab/ailoy"

[dependency-groups]
dev = ["maturin>=1.9,<2", "pytest>=8", "pytest-asyncio>=1"]

# TEMPORARY: virtx's checkout beside this one, until a virtx release has `_relay`; see the
# workspace's `[patch.crates-io]`.
[tool.uv.sources]
virtx = { path = "../../../virtx/bindings/python", editable = true }

[tool.maturin]
python-source = "python"
module-name = "ailoy._ailoy"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
