# The Rust this repository builds with, everywhere.
#
# `stable` is a subscription, not a pin: clippy adds lints every six weeks, and the first run after
# a release fails on code nobody touched. Pinning also makes the gate a contributor runs before
# pushing the gate that judges them.
#
# Bumping is a deliberate change, and `channel` is the one place to make it: the release jobs
# that build in this checkout read it from here, and the smoke that builds the packed crate as a
# user would stays on `stable`. `rust-version` in `Cargo.toml` is the floor a dependent may build with
# and moves independently.
#
# Cross-compilation targets stay out of this file: the release jobs ask for theirs through the
# action, and listing them here would make every contributor download standard libraries they
# never build against.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
