version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    exclude-paths:
      - "examples/"
    groups:
      cargo-patch:
        applies-to: "security-updates"
        update-types:
          - "patch"
      cargo-version-patch:
        applies-to: "version-updates"
        update-types:
          - "patch"

  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    exclude-paths:
      - "examples/"
    groups:
      npm-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
      npm-version-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  # The docs keep ailoy.co's Astro and Starlight versions, so they are raised by hand with
  # ailoy.co's. A limit of 0 turns off version updates here; security updates still come.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docs-npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    exclude-paths:
      - "examples/"
    groups:
      uv-minor-patch:
        applies-to: "security-updates"
        update-types:
          - "minor"
          - "patch"
      uv-version-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    exclude-paths:
      - "examples/"
    groups:
      actions:
        applies-to: "security-updates"
        patterns:
          - "*"
      actions-version:
        applies-to: "version-updates"
        patterns:
          - "*"
