name: Model request
description: A model Ailoy cannot run yet
type: Feature
labels: [model request]
body:
  - type: markdown
    attributes:
      value: |
        [Model providers](https://brekkylab.github.io/ailoy/guide/model-providers) lists the model families Ailoy runs now, and the [model requests](https://github.com/brekkylab/ailoy/issues?q=is%3Aissue%20label%3A%22model%20request%22) the ones already asked for.

  - type: input
    id: model
    attributes:
      label: Model
      description: The name its maker gives it, the official API id or the Hugging Face repo id.
      placeholder: e.g. mistralai/Mistral-Large-Instruct-2411
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else
      description: Whatever would help, such as a link to the model, the API you would run it through and what you would use it for.
