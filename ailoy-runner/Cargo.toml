[package]
name = "ailoy-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Where an Ailoy agent runs: the run loop, models, tools and browser, what provides them, and the router that serves them."
readme = "../README.md"
keywords = ["agent", "llm", "ai", "tool-use", "sandbox"]
categories = ["development-tools"]
# Only `.rs` under `src/`: `include` overrides `.gitignore`, so `/src/**` would pack a stray
# `.DS_Store` too.
include = ["/src/**/*.rs"]

[features]
# The virtx library linked in, for a Rust program over `ailoy` alone. The bindings leave it out:
# each opens the library the virtx package of its language opened, so that the caller's sandbox
# and the agent's are over one.
default = ["embedded"]
embedded = ["virtx/embedded"]

[dependencies]
# The spec, messages and tool descriptions, which this crate shows as its own.
ailoy-core = { path = "../ailoy-core", version = "0.3.2" }
axum = { version = "0.8", default-features = false, features = ["json"] }
http-over-x = { git = "https://github.com/ailoy-co/http-over-x", rev = "f21730b", default-features = false, features = ["server"] }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
virtx = { workspace = true }
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.19"
futures = "0.3"
hex = "0.4"
html-to-markdown-rs = { version = "3.4", features = ["metadata"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
log = "0.4"
parking_lot = "0.13"
png = "0.18"
schemars = { version = "1", features = ["preserve_order", "url2"] }
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
# MCP client only: no server/macros defaults, and just the two transports
# `MCPTransport` names (stdio child process, streamable HTTP).
rmcp = { version = "3", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "7"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"
strum_macros = "0.28"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
# wreq 6 defaults to only webpki-roots and tokio-rt, so every other feature this
# crate relies on is named here; wreq-util's emulation-compression supplies the
# content-encoding profile. Re-check this list whenever the pin moves, since a
# feature leaving default is a silent behavior change.
wreq = { version = "=6.0.0-rc.31", features = ["brotli", "charset", "deflate", "gzip", "stream", "system-proxy", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"] }

[dev-dependencies]
ailoy-core = { path = "../ailoy-core", features = ["embed"] }
axum = "0.8"
virtx = { workspace = true }
dotenvy = "0.15"
# MCP *server* half, only for the in-process server in the `mcp` tests (feature
# unification also enables it for the lib under `cargo test`).
# `default-features = false` is required: rmcp 3.3.0's defaults pull
# `rmcp-macros = "3.3.0"`, which is not published.
rmcp = { version = "3", default-features = false, features = ["server"] }
test-with = { version = "0.17", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }
