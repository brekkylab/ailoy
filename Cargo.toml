[workspace]
members = [
    "./",
    "apps/desktop/core",
]
# A bare `cargo build`/`cargo check`/`cargo test` at the root builds the root crate only.
# `ailoy-desktop-core` enables cortex's `fuse-t` feature, whose build script panics on a
# machine without FUSE-T installed — so leaving the engine in the default set would stop
# every contributor who only works on `ailoy` itself. The engine is built explicitly, with
# `-p ailoy-desktop-core`.
default-members = ["./"]
exclude = [
    ".worktrees",
    # Tauri pulls the whole webview stack; it is its own workspace so a root `cargo test`
    # does not pay for it. See apps/desktop/src-tauri/Cargo.toml.
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[package]
name = "ailoy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"


[features]
default = []

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
# The console library `runenv_v2` is built on. Still developed alongside this
# crate in a sibling checkout, so it is a path dependency until it is published
# — moving it to a version or git pin is what makes this crate buildable
# elsewhere.
#
# Without cortex's defaults: its one default, `local`, carries a console server
# inside whatever links it, and this crate never starts a console — its caller
# hands one in, and picks the backend. The tests do start one, so `local` comes
# back under `[dev-dependencies]`.
cortex = { path = "../cortex/cortex", default-features = false }
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.18"
futures = "0.3"
hex = "0.4"
html-to-markdown-rs = { version = "3.4", features = ["metadata"] }
humantime = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
log = "0.4"
ordered-float = { version = "5.0.0", features = ["serde"] }
parking_lot = "0.12.4"
png = "0.18"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
# MCP client. `default-features = false` drops the server/macros defaults we do
# not use; the feature list is exactly the client plus the two transports the
# `ToolProvider` exposes (stdio child process, streamable HTTP).
rmcp = { version = "3", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
scraper = "0.27"
jsonschema = { version = "0.49", default-features = false }
schemars = { version = "0.9", features = ["preserve_order", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"
strum_macros = "0.28"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
# Document text extraction for the `docread` tool. `default-features = false`
# drops the tokio/simd defaults we re-request by name; the feature list is the
# set of format backends, all pure Rust — no ONNX, no OCR models, nothing
# downloaded at runtime. Adding a format here is the only change a new
# extension needs. Keep `ocr` out: it pulls tesseract and a model cache.
xberg = { version = "1.1", default-features = false, features = ["pdf", "office", "excel", "hwp", "hwpx", "html", "tokio-runtime"] }
# wreq 6 trimmed its default feature set down to webpki-roots and tokio-rt, so
# everything else this crate relies on has to be requested by name. charset and
# system-proxy were in wreq 5's defaults; the decompression features and stream
# were already explicit; emulation-compression restores the content-encoding
# profile that wreq-util 2.x applied on its own. Re-check this list whenever the
# pin moves, since a feature leaving default is a silent behavior change.
wreq = { version = "=6.0.0-rc.29", features = ["brotli", "charset", "deflate", "gzip", "stream", "system-proxy", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"] }

[dev-dependencies]
axum = "0.8"
# The console the tests start (`crate::test_console`): `Backend::local`, the
# server cortex builds and carries, so a test needs no program installed.
cortex = { path = "../cortex/cortex", features = ["local"] }
dotenvy = "0.15"
# The MCP *server* half, used only to stand up an in-process server for the
# `mcp` tests. Feature unification means the lib picks these up under
# `cargo test` too, which is why they are not in the main dependency.
# `default-features = false` is required, not tidiness: rmcp 3.3.0's default
# feature set pulls `rmcp-macros = "3.3.0"`, which is not published.
rmcp = { version = "3", default-features = false, features = ["server"] }
test-with = { version = "0.17", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }
# Builds the OOXML/EPUB fixtures `docread`'s tests extract from, so they stay
# readable XML in the test file instead of checked-in binaries.
zip = { version = "8", default-features = false, features = ["deflate"] }

