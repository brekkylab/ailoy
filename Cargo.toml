[workspace]
members = [
    "./",
]
exclude = [
    ".worktrees",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[package]
name = "ailoy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"


[features]
default = []
sandbox = ["dep:cortex", "dep:msb_krun"]

[dependencies]
# cortex provides the VFS (Mountable/S3Volume + PosixAdapter -> DynFileSystem);
# ailoy's `krun` module boots the VM and mounts it. Pinned to cortex's VFS-only
# (raw-krun) rev.
cortex = { git = "https://github.com/brekkylab/cortex.git", rev = "93e5e8d5d91d7db62eedb2c7ee7c8186e2d83ccf", features = ["krun", "s3"], optional = true }
msb_krun = { version = "=0.1.25", features = ["blk"], optional = true }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.18"
futures = "0.3"
hex = "0.4"
html-to-markdown-rs = { version = "3.4", features = ["metadata"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
log = "0.4"
ordered-float = { version = "5.0.0", features = ["serde"] }
parking_lot = "0.12.4"
png = "0.18"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
scraper = "0.27"
jsonschema = { version = "0.49", default-features = false }
schemars = { version = "0.9", features = ["preserve_order", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"
strum_macros = "0.28"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
# wreq 6 trimmed its default feature set down to webpki-roots and tokio-rt, so
# everything else this crate relies on has to be requested by name. charset and
# system-proxy were in wreq 5's defaults; the decompression features and stream
# were already explicit; emulation-compression restores the content-encoding
# profile that wreq-util 2.x applied on its own. Re-check this list whenever the
# pin moves, since a feature leaving default is a silent behavior change.
wreq = { version = "=6.0.0-rc.29", features = ["brotli", "charset", "deflate", "gzip", "stream", "system-proxy", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"] }

[dev-dependencies]
axum = "0.8"
dotenvy = "0.15"
test-with = { version = "0.17", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }

# microsandbox 0.6.7 computes a sparse-sha256 integrity digest over the upper
# layer's full logical size (default 4 GiB) on snapshot create, save, and load,
# so sandbox snapshot tests hash ~12 GiB per round trip. Unoptimized sha2 runs
# at ~130 MB/s, which turns that into ~32 s per pass under the dev profile.
# Optimizing just the hash crates restores hardware-speed hashing (~2.6 GB/s).
# Applies only when this workspace is built directly; release builds and
# crates depending on ailoy are unaffected.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
