[workspace]
members = [
    "./",
]
exclude = [
    ".worktrees",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[package]
name = "ailoy"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[features]
rt = []
default = ["rt"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.16"
futures = "0.3"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
ordered-float = { version = "5.0.0", features = ["serde"] }
parking_lot = "0.12.4"
png = "0.18"
reqwest = { version = "0.12", features = ["json", "stream"] }
rmcp = { version = "0.11.0", features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
scraper = "0.24"
schemars = { version = "0.8", features = ["preserve_order", "url"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.27", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "6"
flate2 = "1"
tar = "0.4"
which = "7"
zip = "2"
strum_macros = "0.27"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
wreq = "5.3.0"
wreq-util = "2.2.6"

[dev-dependencies]
axum = "0.8"
dotenvy = "0.15"
test-with = { git = "https://github.com/brekkylab/test-with.git", branch = "main", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }
