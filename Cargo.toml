[workspace]
resolver = "3"
members = [
    "ailoy-core",
    "ailoy-node",
    "ailoy-py",
    "ailoy-rs",
    "ailoy-runner",
]
exclude = [
    ".worktrees",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[workspace.dependencies]
# The client. Its library is `ailoy`'s `embedded` feature, or the one a binding opens.
virtx = { version = "0.2.0", default-features = false }
