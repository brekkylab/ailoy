[workspace]
members = [
    "./",
]
exclude = [
    ".worktrees",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[package]
name = "ailoy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"


[features]
default = []
# The sandbox runenv builds the per-sandbox ext4 upper / base EROFS on the host
# and manages boots. The VM itself (libkrun + cortex virtio-fs serving + the
# smoltcp net stack) lives in the separate `crates/ailoy-krun-boot` helper that
# build.rs compiles and embeds — so those heavy deps are NOT linked into the ailoy
# library; only the host-side image tooling is gated here.
sandbox = [
    "dep:microsandbox-image",
    "dep:microsandbox-utils",
]
# The local (no-VM) runenv adds cortex's host-FUSE binding, so an agent's shell
# sees the same tree a sandboxed one would. Needs a libfuse provider at build
# time (macFUSE / FUSE-T on macOS, /dev/fuse on Linux); see cortex's `fuse`.
local-fuse = ["cortex/fuse"]

[dependencies]
# cortex provides the VFS (Mountable/S3Volume/NotionVolume + PosixFs ->
# DynFileSystem); ailoy's `krun` module boots the VM and mounts it. Pinned to the
# adapter-restructure merge (PosixFs + krun/fuse/fuse-t bindings, VolumeSpec).
# Always on: every runenv (sandbox or local) is built on cortex's
# `Workspace`/`VolumeSpec`, and every VFS provider must be constructible whatever
# the runenv, so `s3`/`notion` are default features. The heavy *interface
# bindings* (krun/fuse/fuse-t) stay gated behind the runenv features above.
cortex = { git = "https://github.com/brekkylab/cortex.git", rev = "0406283d03b29cf64fb2112bc7439a3e37cfb473", features = ["s3", "notion"] }
# Pure-Rust ext4 formatter (`format_ext4`): create the per-sandbox writable upper
# on the host with no `mkfs` dependency and no committed image blob. (The VM-side
# crates — msb_krun, microsandbox-network, rustls — live in the ailoy-krun-boot
# helper, not here.)
microsandbox-image = { version = "=0.6.7", optional = true }
# Sparse-extent scanning (`ExtentMap::scan`, SEEK_DATA/SEEK_HOLE on both macOS and
# Linux): lets snapshots read only the upper's allocated ranges, so save/restore
# is O(data written), not O(logical size). (Same fix as microsandbox PR #1150.)
# Also carries the libkrunfw download URL/filename helpers used by resolve_kernel.
microsandbox-utils = { version = "=0.6.7", optional = true }
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.18"
futures = "0.3"
hex = "0.4"
html-to-markdown-rs = { version = "3.4", features = ["metadata"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
log = "0.4"
ordered-float = { version = "5.0.0", features = ["serde"] }
parking_lot = "0.12.4"
png = "0.18"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
scraper = "0.27"
jsonschema = { version = "0.49", default-features = false }
schemars = { version = "0.9", features = ["preserve_order", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"
strum_macros = "0.28"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
# wreq 6 trimmed its default feature set down to webpki-roots and tokio-rt, so
# everything else this crate relies on has to be requested by name. charset and
# system-proxy were in wreq 5's defaults; the decompression features and stream
# were already explicit; emulation-compression restores the content-encoding
# profile that wreq-util 2.x applied on its own. Re-check this list whenever the
# pin moves, since a feature leaving default is a silent behavior change.
wreq = { version = "=6.0.0-rc.29", features = ["brotli", "charset", "deflate", "gzip", "stream", "system-proxy", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"] }

[dev-dependencies]
axum = "0.8"
dotenvy = "0.15"
test-with = { version = "0.17", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }
