[workspace]
members = [
    "./",
    "bindings/node",
    "bindings/python",
    "apps/desktop/core",
]
# A bare `cargo build`/`cargo check`/`cargo test` at the root builds the root crate only:
# the engine brings virtx's S3 and Notion stores, which a contributor working on `ailoy`
# itself has no use for. It is built explicitly, with `-p ailoy-desktop-core`.
default-members = ["./"]
exclude = [
    ".worktrees",
    # Tauri pulls the whole webview stack; it is its own workspace so a root `cargo test`
    # does not pay for it. See apps/desktop/src-tauri/Cargo.toml.
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/brekkylab/ailoy"

[workspace.dependencies]
virtx = { version = "0.1.1", default-features = false }
virtx-node = { git = "https://github.com/brekkylab/virtx", tag = "v0.1.1", default-features = false }
virtx-python = { git = "https://github.com/brekkylab/virtx", tag = "v0.1.1", default-features = false }

[patch."https://github.com/brekkylab/virtx"]
virtx = { version = "0.1.1" }

[package]
name = "ailoy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agents that drive a language model through tool-augmented turns, in a virtx console."
readme = "README.md"
keywords = ["agent", "llm", "ai", "tool-use", "sandbox"]
categories = ["development-tools"]
# What a dependent builds: the library. The bindings are packages of their own, and the
# examples need files and keys beside them that a dependent has no use for. Only `.rs`
# under `src/`: `include` overrides `.gitignore`, so `/src/**` would pack a stray
# `.DS_Store` too.
include = [
    "/src/**/*.rs",
    "/README.md",
    "/LICENSE.md",
]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"


[features]
default = []

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.23"
virtx = { workspace = true, features = ["mount", "ensure"] }
dedent = "0.1.1"
derive_builder = "0.20.2"
fancy-regex = "0.18"
futures = "0.3"
hex = "0.4"
html-to-markdown-rs = { version = "3.4", features = ["metadata"] }
humantime = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.22"
log = "0.4"
ordered-float = { version = "5.0.0", features = ["serde"] }
parking_lot = "0.12.4"
png = "0.18"
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
# MCP client only: no server/macros defaults, and just the two transports
# `MCPToolProviderElem` names (stdio child process, streamable HTTP).
rmcp = { version = "3", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
scraper = "0.27"
jsonschema = { version = "0.49", default-features = false }
schemars = { version = "0.9", features = ["preserve_order", "url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
shellexpand = "3"
tempfile = "3"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1"
tar = "0.4"
strum_macros = "0.28"
thiserror = "2.0.15"
tokio = { version = "1.0", default-features = false, features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
unicode-segmentation = "1.12.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
uuid = { version = "1.18.0", features = ["v4"] }
# wreq 6 defaults to only webpki-roots and tokio-rt, so every other feature this
# crate relies on is named here; wreq-util's emulation-compression supplies the
# content-encoding profile. Re-check this list whenever the pin moves, since a
# feature leaving default is a silent behavior change.
wreq = { version = "=6.0.0-rc.29", features = ["brotli", "charset", "deflate", "gzip", "stream", "system-proxy", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-compression"] }

[dev-dependencies]
axum = "0.8"
dotenvy = "0.15"
# MCP *server* half, only for the in-process server in the `mcp` tests (feature
# unification also enables it for the lib under `cargo test`).
# `default-features = false` is required: rmcp 3.3.0's defaults pull
# `rmcp-macros = "3.3.0"`, which is not published.
rmcp = { version = "3", default-features = false, features = ["server"] }
test-with = { version = "0.17", default-features = false, features = ["executable"] }
tokio = { version = "1.0", features = ["net"] }

[[example]]
name = "hello"
path = "examples/hello/rust/main.rs"

[[example]]
name = "cad"
path = "examples/cad/rust/main.rs"

[[example]]
name = "laya"
path = "examples/laya/rust/main.rs"

[[example]]
name = "offshore_leaks"
path = "examples/offshore_leaks/rust/main.rs"

[[example]]
name = "retail_bench"
path = "examples/retail_bench/rust/main.rs"

[[example]]
name = "gameplay"
path = "examples/gameplay/rust/main.rs"

[[example]]
name = "sam3"
path = "examples/sam3/rust/main.rs"

[[example]]
